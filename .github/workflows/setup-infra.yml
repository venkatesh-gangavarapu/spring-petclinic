name: Setup EKS Infrastructure (Run Once)

on:
  workflow_dispatch:

jobs:
  create-eks-cluster:
    name: Create EKS Cluster
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Install eksctl
        run: |
          ARCH=amd64
          PLATFORM=$(uname -s)_$ARCH
          curl -sLO "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_${PLATFORM}.tar.gz"
          tar -xzf "eksctl_${PLATFORM}.tar.gz" -C /tmp && rm "eksctl_${PLATFORM}.tar.gz"
          sudo mv /tmp/eksctl /usr/local/bin
          eksctl version

      - name: Delete broken cluster if nodes are missing
        run: |
          if eksctl get cluster --name petclinic-cluster --region ap-south-1 2>/dev/null; then
            echo "Cluster exists. Checking node groups..."
            NG_COUNT=$(eksctl get nodegroup --cluster petclinic-cluster --region ap-south-1 2>/dev/null | tail -n +2 | wc -l)
            echo "Node groups found: $NG_COUNT"

            aws eks update-kubeconfig --name petclinic-cluster --region ap-south-1
            NODE_COUNT=$(kubectl get nodes --no-headers 2>/dev/null | wc -l)
            echo "Nodes in kubectl: $NODE_COUNT"

            if [ "$NODE_COUNT" -eq 0 ]; then
              echo "Cluster has no healthy nodes. Deleting and recreating..."
              eksctl delete cluster --name petclinic-cluster --region ap-south-1 --wait
              echo "Cluster deleted."
            else
              echo "Cluster has $NODE_COUNT healthy nodes. Skipping recreation."
              kubectl get nodes -o wide
              exit 0
            fi
          else
            echo "No existing cluster found."
          fi

      - name: Create EKS cluster with nodes (single command)
        run: |
          echo "Creating EKS cluster + node group together..."
          eksctl create cluster -f eksctl/cluster.yaml
          echo "Cluster and nodes created."

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name petclinic-cluster --region ap-south-1

      - name: Verify nodes are Ready
        run: |
          echo "Verifying nodes..."
          for i in $(seq 1 20); do
            NODE_COUNT=$(kubectl get nodes --no-headers 2>/dev/null | wc -l)
            READY_COUNT=$(kubectl get nodes --no-headers 2>/dev/null | grep -c " Ready" || true)
            echo "  ($i/20) total=$NODE_COUNT ready=$READY_COUNT"
            if [ "$NODE_COUNT" -gt 0 ] && [ "$NODE_COUNT" -eq "$READY_COUNT" ]; then
              echo "All nodes are Ready."
              kubectl get nodes -o wide
              break
            fi
            sleep 20
          done

      - name: Create petclinic namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Done
        run: |
          echo "============================================"
          echo " EKS cluster is ready!"
          echo " Push to main to trigger auto-deployment."
          echo "============================================"
          kubectl get nodes

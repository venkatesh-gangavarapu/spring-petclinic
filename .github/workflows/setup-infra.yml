name: Setup EKS Infrastructure (Run Once)

on:
  workflow_dispatch:

jobs:
  create-eks-cluster:
    name: Create EKS Cluster
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Install eksctl
        run: |
          ARCH=amd64
          PLATFORM=$(uname -s)_$ARCH
          curl -sLO "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_${PLATFORM}.tar.gz"
          tar -xzf "eksctl_${PLATFORM}.tar.gz" -C /tmp && rm "eksctl_${PLATFORM}.tar.gz"
          sudo mv /tmp/eksctl /usr/local/bin
          eksctl version

      - name: Create EKS cluster (skip if already exists)
        run: |
          if eksctl get cluster --name petclinic-cluster --region ap-south-1 2>/dev/null; then
            echo "Cluster already exists, skipping cluster creation."
          else
            echo "Creating EKS cluster... this takes ~15 minutes."
            eksctl create cluster \
              --name petclinic-cluster \
              --region ap-south-1 \
              --version 1.30 \
              --without-nodegroup
            echo "Cluster control plane created."
          fi

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name petclinic-cluster --region ap-south-1

      - name: Create node group (skip if already exists)
        run: |
          if eksctl get nodegroup \
              --cluster petclinic-cluster \
              --region ap-south-1 \
              --name petclinic-nodes 2>/dev/null; then
            echo "Node group already exists, skipping."
          else
            echo "Creating managed node group..."
            eksctl create nodegroup \
              --cluster petclinic-cluster \
              --region ap-south-1 \
              --name petclinic-nodes \
              --node-type t3.medium \
              --nodes 2 \
              --nodes-min 1 \
              --nodes-max 3 \
              --managed
          fi

      - name: Wait for nodes to be Ready
        run: |
          echo "Waiting for nodes to join and become Ready..."
          for i in $(seq 1 30); do
            NODE_COUNT=$(kubectl get nodes --no-headers 2>/dev/null | wc -l)
            READY_COUNT=$(kubectl get nodes --no-headers 2>/dev/null | grep -c " Ready" || true)
            echo "  ($i/30) Nodes total=$NODE_COUNT ready=$READY_COUNT"
            if [ "$NODE_COUNT" -gt 0 ] && [ "$NODE_COUNT" -eq "$READY_COUNT" ]; then
              echo "All nodes are Ready."
              break
            fi
            sleep 20
          done
          kubectl get nodes -o wide

      - name: Create petclinic namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Done
        run: |
          echo "============================================"
          echo " EKS cluster is ready with nodes!"
          echo " Push to main to trigger auto-deployment."
          echo "============================================"
          kubectl get nodes

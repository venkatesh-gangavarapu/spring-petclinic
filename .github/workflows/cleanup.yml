name: Cleanup - Delete EKS Infrastructure

on:
  workflow_dispatch:

jobs:
  delete-cluster:
    name: Delete EKS Cluster
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Install eksctl
        run: |
          ARCH=amd64
          PLATFORM=$(uname -s)_$ARCH
          curl -sLO "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_${PLATFORM}.tar.gz"
          tar -xzf "eksctl_${PLATFORM}.tar.gz" -C /tmp && rm "eksctl_${PLATFORM}.tar.gz"
          sudo mv /tmp/eksctl /usr/local/bin

      - name: Delete EKS cluster
        run: |
          if eksctl get cluster --name petclinic-cluster --region ap-south-1 2>/dev/null; then
            echo "Deleting cluster..."
            eksctl delete cluster --name petclinic-cluster --region ap-south-1 --wait
            echo "Cluster deleted."
          else
            echo "No cluster found. Nothing to delete."
          fi

name: CI/CD - Build and Deploy to EKS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name petclinic-cluster \
            --region ap-south-1

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/config-server.yaml
          kubectl apply -f k8s/discovery-server.yaml
          kubectl apply -f k8s/api-gateway.yaml

      - name: Wait for config-server
        run: |
          kubectl rollout status deployment/config-server \
            -n petclinic --timeout=300s

      - name: Wait for discovery-server
        run: |
          kubectl rollout status deployment/discovery-server \
            -n petclinic --timeout=300s

      - name: Wait for api-gateway
        run: |
          kubectl rollout status deployment/api-gateway \
            -n petclinic --timeout=300s

      - name: Print LoadBalancer URL
        run: |
          echo "Waiting for AWS LoadBalancer to assign hostname..."
          for i in $(seq 1 20); do
            HOSTNAME=$(kubectl get svc api-gateway -n petclinic \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -n "$HOSTNAME" ]; then
              echo ""
              echo "============================================"
              echo " api-gateway is live:"
              echo " http://$HOSTNAME/actuator/health"
              echo "============================================"
              exit 0
            fi
            echo "  ($i/20) Still waiting..."
            sleep 15
          done
          echo "LoadBalancer hostname not ready yet. Check manually:"
          echo "  kubectl get svc api-gateway -n petclinic"
